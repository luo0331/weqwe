name: Build IPAs
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        variant: [lite, full]
    steps:
      - uses: actions/checkout@v4

      - name: 还原目录结构（兼容网页上传被摊平的情况）
        run: |
          move() { [ -f "$1" ] && mv "$1" "$2" || true; }
          mkdir -p SQJQTracker/App SQJQTracker/Core SQJQTracker/Session SQJQTracker/Views BroadcastExtension
          move SQJQTrackerApp.swift SQJQTracker/App/
          move Board.swift SQJQTracker/Core/
          move Rank.swift SQJQTracker/Core/
          move GameEvent.swift SQJQTracker/Core/
          move FrameStore.swift SQJQTracker/Core/
          move ImageStat.swift SQJQTracker/Core/
          move OCREngine.swift SQJQTracker/Core/
          move VisionPipeline.swift SQJQTracker/Core/
          move InferenceEngine.swift SQJQTracker/Core/
          move RecordStore.swift SQJQTracker/Core/
          move GlyphStore.swift SQJQTracker/Core/
          move GameSession.swift SQJQTracker/Session/
          move PiPManager.swift SQJQTracker/Session/
          move CameraManager.swift SQJQTracker/Session/
          move FrameServer.swift SQJQTracker/Session/
          move DashboardView.swift SQJQTracker/Views/
          move BoardCanvasView.swift SQJQTracker/Views/
          move CalibrationView.swift SQJQTracker/Views/
          move RecordsView.swift SQJQTracker/Views/
          move SettingsView.swift SQJQTracker/Views/
          move RootTabView.swift SQJQTracker/Views/
          move BroadcastPicker.swift SQJQTracker/Views/
          move LayoutImportView.swift SQJQTracker/Views/
          move SQJQTracker.entitlements SQJQTracker/
          move SampleHandler.swift BroadcastExtension/
          move BroadcastExtension.entitlements BroadcastExtension/

      - name: 自动修复弯引号（翻译工具会把 " 替换成 “ ”，导致编译失败）
        run: |
          python3 - <<'PYEOF'
          import pathlib
          total = 0
          for p in pathlib.Path('.').rglob('*.swift'):
              t = p.read_text(encoding='utf-8')
              if '\u201c' not in t and '\u201d' not in t and '\u2018' not in t and '\u2019' not in t:
                  continue
              out = []
              in_str = False
              esc = False
              changed = 0
              for ch in t:
                  if esc:
                      esc = False; out.append(ch); continue
                  if in_str:
                      if ch == '\\':
                          esc = True; out.append(ch); continue
                      if ch == '"':
                          in_str = False; out.append(ch); continue
                      out.append(ch); continue
                  else:
                      if ch == '"':
                          in_str = True; out.append(ch); continue
                      if ch == '\u201c' or ch == '\u201d':
                          out.append('"'); changed += 1; continue
                      if ch == '\u2018' or ch == '\u2019':
                          out.append("'"); changed += 1; continue
                      out.append(ch); continue
              if changed:
                  p.write_text(''.join(out), encoding='utf-8')
                  print('fixed %d in %s' % (changed, p))
                  total += changed
          print('TOTAL_FIXED:', total)
          PYEOF

      - name: 安装 XcodeGen 并生成工程
        run: |
          brew install xcodegen
          # 优先选已知可靠的 Xcode 16.0~16.2（16.3/16.4 的 Swift 驱动有 malformed-JSON bug）
          XSEL=""
          for d in Xcode_16.2 Xcode_16.1 Xcode_16.0.1 Xcode_16.0; do
            if [ -d "/Applications/$d.app" ]; then XSEL="/Applications/$d.app"; break; fi
          done
          # 集成驱动在批量编译时会输出 malformed-JSON（IPC bug），统一改用传统驱动
          EXTRA_FLAGS="SWIFT_USE_INTEGRATED_DRIVER=NO"
          if [ -z "$XSEL" ] && [ -d "/Applications/Xcode_15.4.app" ]; then
            XSEL="/Applications/Xcode_15.4.app"
          fi
          if [ -n "$XSEL" ]; then sudo xcode-select -s "$XSEL/Contents/Developer"; fi
          xcodebuild -version
          if [ "${{ matrix.variant }}" = "lite" ]; then
            xcodegen generate -s project.lite.yml
            PROJ="SQJQTrackerLite.xcodeproj"
          else
            xcodegen generate
            PROJ="SQJQTracker.xcodeproj"
          fi
          set -o pipefail
          xcodebuild -project "$PROJ" -scheme SQJQTracker -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            $EXTRA_FLAGS \
            2>&1 | tee build.log

      - name: 提取编译错误
        if: failure()
        run: |
          echo "========== error 行汇总 =========="
          grep -E "error:" build.log | sort -u | head -60 || echo "(无 error: 行)"
          echo "========== 本轮使用的 Xcode =========="
          grep -E "Command line invocation" build.log | head -2 || true
          echo "========== 数字流解码（还原被污染的输出）=========="
          python3 - <<'PYEOF'
          import re
          raw = open('build.log', encoding='utf-8', errors='replace').read()
          nums = []
          for line in raw.split('\n'):
              s = line.strip()
              if s and re.fullmatch(r'[0-9]{1,3}(, ?[0-9]{1,3})*,?', s):
                  nums += [int(x) for x in re.findall(r'[0-9]+', s)]
          print("DECODED_BYTES:", len(nums))
          if nums:
              b = bytes(min(255, max(0, n)) for n in nums)
              print(b.decode('utf-8', errors='replace')[-4000:])
          else:
              print("(无数字流)")
              print(raw[-3000:])
          PYEOF
          echo "========== 结束 =========="

      - name: 上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.variant }}
          path: build.log

      - name: 回传完整日志到仓库（便于自动排查）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B64=$(base64 -i build.log | tr -d '\n')
          gh api --method PUT "repos/${{ github.repository }}/contents/ci-debug/build-log-${{ github.run_id }}-${{ matrix.variant }}.txt" \
            -f message="ci: build log for run ${{ github.run_id }} (${{ matrix.variant }})" \
            -f content="$B64" >/dev/null 2>&1 && echo "log committed" || echo "log commit failed"

      - name: 打包 IPA
        run: |
          mkdir Payload
          cp -R "build/Build/Products/Release-iphoneos/SQJQTracker.app" Payload/
          zip -qry "SQJQTracker-${{ matrix.variant }}-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SQJQTracker-${{ matrix.variant }}-unsigned-ipa
          path: SQJQTracker-${{ matrix.variant }}-unsigned.ipa
