name: SQJQTrackerLite
options:
  bundleIdPrefix: com.sqjq
  objectVersion: "56"
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    TARGETED_DEVICE_FAMILY: "1"

schemes:
  SQJQTracker:
    build:
      targets:
        SQJQTracker: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  SQJQTracker:
    type: application
    platform: iOS
    sources:
      - SQJQTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sqjq.tracker.lite
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: LITE
    info:
      path: SQJQTracker/Info.plist
      properties:
        CFBundleDisplayName: 四国记牌器Lite
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSCameraUsageDescription: 用于拍摄棋盘/棋谱辅助识别
        NSPhotoLibraryUsageDescription: 用于导入棋谱截图与校准截图
        ITSAppUsesNonExemptEncryption: false
